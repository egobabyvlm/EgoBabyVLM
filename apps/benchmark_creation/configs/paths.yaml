# benchmark_creation path configuration.
#
# Relative paths are resolved against the package root (benchmark_creation/).
#
# To override these defaults without editing this file, set the environment
# variable BENCHMARK_CREATION_PATHS to the path of your own YAML file, e.g.:
#
#   export BENCHMARK_CREATION_PATHS=~/.config/benchmark_creation/paths.yaml
#
# Any keys present in the override file take precedence over this default.

# Base directory for outputs, logs, submitit, generated images, etc.
outputs_root: ./MachineDevBench

# --- Dataset manifests ---
# Bundled under resources/ (relative to package root). Stored gzipped to keep
# the repo small; loaders open them via gzip transparently.
howto100m_manifest: resources/howto100m_manifest.json.gz
ego4d_manifest: resources/ego4d_manifest.json.gz
# COCO is provided as one MetaCLIP-cleaned caption per line. Plain-text
# manifests are loaded directly by TextDataset (one utterance per line).
coco_captions: resources/coco_metaclip_captions.txt.gz
babyview_manifest: resources/babyview_manifest.txt.gz
